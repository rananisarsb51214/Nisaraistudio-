🔒 Required GitHub Secrets

Go to your repository → Settings → Secrets and variables → Actions and add these:

· AZURE_APP_NAME – the exact name of your Azure Web App (e.g., my-python-app).
· AZURE_PUBLISH_PROFILE – the XML publish profile (download from Azure Portal → Web App → Get Publish Profile).

💡 Security upgrade (optional but recommended): Instead of a publish profile, use OpenID Connect (OIDC) with azure/login@v2. This avoids storing long‑lived secrets. Let me know if you want me to rewrite the deploy step to use OIDC.

---

🤔 What About the “Node.js” Step?

Your original had a line for Deploy to Node.js environment. Since actions/deploy-node does not exist, I removed it.

If you actually have a separate Node.js microservice that also needs deploying, you have two clean options:

1. Two separate workflows (one for Python, one for Node.js).
2. Two jobs inside the same workflow (like the build/deploy above, but repeated for the Node.js folder).

For example, to deploy a Node.js app to a different Azure Web App, add this job:

```yaml
deploy-node:
  runs-on: ubuntu-latest
  needs: build
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci --prefix ./node-app
    - uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ secrets.AZURE_NODE_APP_NAME }}
        publish-profile: ${{ secrets.AZURE_NODE_PUBLISH_PROFILE }}
        package: ./node-app
```

