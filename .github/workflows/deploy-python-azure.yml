▶️ How to Use This

1. Copy the YAML block into a new file at .github/workflows/deploy-python-azure.yml.
2. Commit and push it to your main branch.
3. Go to the Actions tab in your GitHub repo – you’ll see the workflow run.
4. For manual runs, click “Run workflow” from the dropdown.

Your app will now be built, packaged, and deployed to Azure automatically on every push to main.

