🚀 The “Best Code” Deployment Workflow

```yaml
# .github/workflows/deploy-python-azure.yml
name: 🚀 Production Deploy to Azure Web App

on:
  workflow_dispatch:                         # Manual trigger (GitHub UI)
  push:
    branches: [ main ]                       # Auto-deploy on push to main

env:
  PYTHON_VERSION: '3.11'                    # Match your runtime
  AZURE_WEBAPP_NAME: ${{ secrets.AZURE_APP_NAME }}  # Set in repo secrets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'                       # Speeds up installs
          cache-dependency-path: orchestrator/requirements.txt

      - name: 📦 Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r orchestrator/requirements.txt

      - name: 🛠️ Prepare deployment package
        run: |
          mkdir deploy_package
          # Copy your application code
          cp -r orchestrator/* deploy_package/
          # Copy installed dependencies into the package
          cp -r venv/lib/python${{ env.PYTHON_VERSION }}/site-packages/* deploy_package/

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-artifact
          path: deploy_package/

  deploy:
    runs-on: ubuntu-latest
    needs: build                            # Waits for build to finish
    if: github.ref == 'refs/heads/main'     # Only deploy from main branch
    environment:
      name: 'production'
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: 📥 Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-artifact
          path: .

      - name: 🌐 Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}  # Keep this secret
          package: .                             # Deploy everything in the folder
```

